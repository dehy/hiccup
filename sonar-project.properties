# SonarQube Cloud analysis, run from CI (.github/workflows/ci.yml, coverage job).
# Automatic Analysis must be disabled in the SonarQube Cloud project settings:
# it cannot import coverage, and it conflicts with CI-based analysis.
# The coverage report path is passed by the workflow: Sonar analyzes each
# crate as a module, so it must be absolute.
sonar.organization=dehy
sonar.projectKey=dehy_hiccup
sonar.projectName=Hiccup

sonar.exclusions=target/**,fuzz/target/**,website/node_modules/**,website/dist/**,website/.astro/**,website/src/content/docs/docs/**
