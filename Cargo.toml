[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate needs nightly and cargo-fuzz; it is built separately.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dehy/hiccup"
authors = ["The Hiccup contributors"]
publish = false

[workspace.dependencies]
# Internal crates
hiccup-control = { path = "crates/hiccup-control" }
hiccup-core = { path = "crates/hiccup-core" }
hiccup-http = { path = "crates/hiccup-http" }
hiccup-proxy = { path = "crates/hiccup-proxy" }

# External crates
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
# Windows only (named pipes with a DACL). Single maintainer: pinned exactly,
# updated deliberately. Unix uses tokio's UnixListener.
interprocess = { version = "=2.4.8", features = ["tokio"] }
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
ring = "0.17"
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tempfile = "3"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
widestring = "1"
x509-parser = "0.18"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
