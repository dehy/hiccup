[workspace]
resolver = "3"
members = ["crates/*"]
# The fuzz crate needs nightly and cargo-fuzz; it is built separately.
exclude = ["fuzz"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dehy/hiccup"
authors = ["The Hiccup contributors"]
publish = false

[workspace.dependencies]
# Internal crates are added here (`name = { path = "crates/name" }`)
# when another crate starts depending on them.
bytes = "1"
clap = { version = "4", features = ["derive"] }
proptest = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
