name: Bug report
description: Something does not work as expected.
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Security issues must be reported privately**, see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps, ideally `hiccup` CLI commands. Include raw requests if relevant, with secrets removed.
      placeholder: |
        1. hiccup serve
        2. hiccup proxy start --listen 127.0.0.1:8080
        3. curl -x http://127.0.0.1:8080 http://example.com
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hiccup version
      description: Output of `hiccup --version`, or a commit hash.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      multiple: true
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version / distribution
      placeholder: e.g. Kali 2026.4, macOS 16.1, Windows 11 24H2
  - type: dropdown
    id: frontend
    attributes:
      label: Frontend
      options: [CLI, Linux (GTK), macOS (SwiftUI), Windows (WinUI)]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Output with `-v`/`-vv`. It is rendered as code.
      render: shell
