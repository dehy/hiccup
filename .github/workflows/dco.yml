# Checks that every commit in a pull request carries a DCO sign-off.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check Signed-off-by trailers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author_email="$(git log -1 --format='%ae' "$sha")"
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -Fqi "<$author_email>"; then
              echo "::error::Commit $sha ($(git log -1 --format='%s' "$sha")) has no 'Signed-off-by' matching its author <$author_email>."
              missing=1
            fi
          done
          if [[ $missing -ne 0 ]]; then
            echo "Sign off with 'git commit -s', or fix existing commits with 'git rebase --signoff $BASE'." >&2
            exit 1
          fi
          echo "All commits are signed off."
